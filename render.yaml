services:
  - type: web
    name: kalenda-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kalenda-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        value: https://eoforidanso.github.io
      - key: FIREBASE_PROJECT_ID
        value: kalenda-bcea9
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@kalenda-bcea9.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false

databases:
  - name: kalenda-db
    databaseName: kalenda
    user: kalenda
