version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalenda
      POSTGRES_USER: kalenda
      POSTGRES_PASSWORD: kalenda_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kalenda']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
